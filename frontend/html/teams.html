<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Your teams - Allegro</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="../imgs/file.svg" type="image/svg+xml" />
		<script src="../js/theme-init.js"></script>
		<link rel="stylesheet" href="../css/global.css" />
		<link rel="stylesheet" href="../css/teams.css" />
	</head>
	<body>
		<header class="topbar">
			<div class="brand">
				<img class="logo" src="../imgs/file.svg" alt="" width="24" height="24" decoding="async" aria-hidden="true" />
				<span class="name">Allegro</span>
			</div>
			<div class="user-menu">
				<button class="btn ghost icon theme-toggle" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme"></button>
				<!-- User avatar + sign-out dropdown -->
				<div class="user-switch" id="user-switch">
					<button
						type="button"
						class="avatar sm user-avatar"
						id="user-avatar"
						aria-haspopup="true"
						aria-expanded="false"
						title="Account"
					></button>
					<div class="user-dropdown" id="user-dropdown" role="menu">
						<button type="button" class="item" id="sign-out-btn" role="menuitem">Sign out</button>
					</div>
				</div>
			</div>
		</header>

		<main>
			<div class="hero">
				<div>
					<h1>Your teams</h1>
				</div>
				<div class="hero-actions">
					<button class="btn primary" id="create-team">+ New team</button>
				</div>
			</div>

			<div class="grid" id="team-grid">
				<button class="team new" id="create-team-2">
					<div>
						<div class="plus">+</div>
						<h2>Create new team</h2>
						<p class="new-team-caption">Start a fresh workspace.</p>
					</div>
				</button>
			</div>

			<section class="invites" id="invites-section" hidden>
				<h3>Pending invitations</h3>
			</section>
		</main>

		<div class="backdrop" id="create-backdrop">
			<div class="modal modal-small">
				<div class="modal-head">
					<h3>Create a new team</h3>
				</div>
				<div class="modal-body">
					<div class="field">
						<label for="team-name">Team name <span class="req">*</span></label>
						<input class="input" id="team-name" placeholder="e.g. Roost Robotics" />
					</div>
					<div class="field">
						<label for="team-bio">Short bio <span class="optional-label">(optional)</span></label>
						<textarea class="textarea" id="team-bio" placeholder="What does this team work on?"></textarea>
						<div class="hint">This is used to give the AI summarization layer extra context about your stack and goals.</div>
					</div>
				</div>
				<div class="modal-foot">
					<button class="btn" id="cancel-create">Cancel</button>
					<button class="btn primary" id="confirm-create">Create team</button>
				</div>
			</div>
		</div>

		<div class="toast" id="toast"></div>

		<script type="module" src="../js/teams.js"></script>
	</body>
</html>
