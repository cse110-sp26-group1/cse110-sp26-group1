<template id="invite-row-template">
	<div class="info">
		<div class="team-mark"></div>
		<div>
			<p><strong class="team-name"></strong> · invited by <span class="inviter-name"></span></p>
			<p>Invited <span class="invite-date"></span></p>
		</div>
	</div>
	<div class="actions">
		<button class="btn sm decline-btn">Decline</button>
		<button class="btn primary sm accept-btn">Accept</button>
	</div>
</template>
