name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mock-e2e:
    name: Mocked browser E2E
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run mocked Playwright tests
        run: npm run test:e2e:mock
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-mock
          path: playwright-report/
          retention-days: 30

  real-api-changes:
    name: Detect Real API E2E Changes
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.changed-files.outputs.should-run }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files
        id: changed-files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          echo "$changed_files"

          if echo "$changed_files" | grep -Eq '^(frontend/|issue-tracker-api/|tests/|playwright\.config\.js$|package(-lock)?\.json$|\.github/workflows/playwright\.yml$)'; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          fi

  real-api-e2e:
    name: Real API E2E
    needs: real-api-changes
    if: ${{ needs.real-api-changes.outputs.should-run == 'true' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install root dependencies
        run: npm ci

      - name: Install API dependencies
        working-directory: issue-tracker-api
        run: npm ci

      - name: Apply local D1 schema
        working-directory: issue-tracker-api
        run: npx wrangler d1 execute issue-tracker-db --local --file=./schema.sql

      - name: Start API
        working-directory: issue-tracker-api
        run: npm run dev -- --ip 127.0.0.1 --port 8787 > ../wrangler.log 2>&1 &

      - name: Wait for API and local D1
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/health > /tmp/api-health.json; then
              cat /tmp/api-health.json
              echo "API is up with local D1"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start or local D1 is not ready"
          cat wrangler.log || true
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run real-backend Playwright tests
        run: npm run test:e2e:real
        env:
          E2E_REAL_API: '1'
          E2E_API_BASE: 'http://127.0.0.1:8787'
          CI: 'true'

      - name: Upload wrangler log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-log
          path: wrangler.log
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-real-api
          path: playwright-report/
          retention-days: 30
