name: API Tests

on:
  push:
    paths:
      - 'issue-tracker-api/**'
      - '.github/workflows/api-tests.yml'
  pull_request:
    paths:
      - 'issue-tracker-api/**'
      - '.github/workflows/api-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: issue-tracker-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm test -- --run
